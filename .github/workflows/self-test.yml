name: self-test
on:
  push:
  workflow_dispatch:
jobs:
  passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: g
        uses: ./
        with:
          site: simgen.dev
      - run: echo "simgen.dev threat level ${{ steps.g.outputs.threat-level }}, ${{ steps.g.outputs.ways-in }} ways in, score ${{ steps.g.outputs.score }}"
  fails-at-elevated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: g
        uses: ./
        continue-on-error: true
        with:
          site: calltheupload.com
          fail-on: elevated
      - name: The scan must have failed
        run: |
          if [ "${{ steps.g.outcome }}" != "failure" ]; then echo "expected a failure at elevated"; exit 1; fi
          echo "Correctly failed: calltheupload.com is ${{ steps.g.outputs.threat-level }} with ${{ steps.g.outputs.ways-in }} ways in"
  old-min-grade-still-works:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: g
        uses: ./
        continue-on-error: true
        with:
          site: calltheupload.com
          min-grade: A
      - run: |
          if [ "${{ steps.g.outcome }}" != "failure" ]; then echo "expected a failure below A"; exit 1; fi
          echo "min-grade still honoured"
