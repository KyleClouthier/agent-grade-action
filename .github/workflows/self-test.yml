name: self-test
on:
  push:
  workflow_dispatch:
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: g
        uses: ./
        with:
          site: simgen.dev
          min-grade: B
      - run: echo "simgen.dev graded ${{ steps.g.outputs.grade }} (${{ steps.g.outputs.score }}/100)"
