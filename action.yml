name: 'AgentDecoy scan'
description: 'Fail the build when a hostile AI agent can steal or abuse your site: leaked keys, AI configs, open MCP or AI servers.'
author: 'Kyle Clouthier'
branding:
  icon: 'shield'
  color: 'red'
inputs:
  site:
    description: 'The site to scan, for example example.com'
    required: true
  fail-on:
    description: 'Threat level that fails the build: critical, elevated or guarded'
    required: false
    default: 'critical'
  min-grade:
    description: 'Older setting, still honoured: lowest defense grade that passes (A to F). Leave empty to use fail-on.'
    required: false
    default: ''
  api-key:
    description: 'Optional AgentDecoy Pro or Agency API key (120 scans an hour instead of 10)'
    required: false
    default: ''
outputs:
  threat-level:
    description: 'critical, elevated, guarded or low'
    value: ${{ steps.scan.outputs.threat-level }}
  ways-in:
    description: 'How many ways in a hostile AI agent would find (critical and elevated findings)'
    value: ${{ steps.scan.outputs.ways-in }}
  findings:
    description: 'The finding ids, comma separated (for example script_secrets,open_mcp)'
    value: ${{ steps.scan.outputs.findings }}
  score:
    description: 'Defense score out of 100'
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: 'Defense grade letter (kept for older workflows)'
    value: ${{ steps.scan.outputs.grade }}
runs:
  using: 'composite'
  steps:
    - id: scan
      shell: bash
      env:
        SITE: ${{ inputs.site }}
        FAIL_ON: ${{ inputs.fail-on }}
        MIN: ${{ inputs.min-grade }}
        KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        url="https://simgen.dev/api/agent-grade?site=$(jq -rn --arg s "$SITE" '$s|@uri')"
        if [ -n "$KEY" ]; then
          resp=$(curl -sS --max-time 120 -H "x-agent-grade-key: $KEY" "$url")
        else
          resp=$(curl -sS --max-time 120 "$url")
        fi
        err=$(jq -r '.error // empty' <<<"$resp")
        if [ -n "$err" ]; then echo "::error::AgentDecoy could not scan $SITE: $err"; exit 1; fi
        grade=$(jq -r '.grade' <<<"$resp"); score=$(jq -r '.score' <<<"$resp"); host=$(jq -r '.site' <<<"$resp")
        level=$(jq -r '.threat.level // "low"' <<<"$resp")
        LEVEL=$(tr '[:lower:]' '[:upper:]' <<<"$level")

        # Every finding, worst first: "LEVEL: title". Kinds and counts only; which file or key goes to the verified owner.
        lines=$(jq -r '[.findings // [] | .[] | {o: ({"critical":0,"elevated":1,"guarded":2}[.level]), l: .level, t: .title}] | sort_by(.o) | .[] | "\(.l | ascii_upcase): \(.t)"' <<<"$resp")
        n=$(jq -r '[.findings // [] | .[] | select(.level != "guarded")] | length' <<<"$resp")
        ids=$(jq -r '[.findings // [] | .[].id] | join(",")' <<<"$resp")

        {
          echo "threat-level=$level"; echo "ways-in=$n"; echo "findings=$ids"; echo "score=$score"; echo "grade=$grade"
        } >> "$GITHUB_OUTPUT"

        while read -r l; do
          [ -z "$l" ] && continue
          case "$l" in CRITICAL:*) echo "::error::$l";; ELEVATED:*) echo "::warning::$l";; *) echo "::notice::$l";; esac
        done <<<"$lines"

        {
          echo "## AgentDecoy: threat level $LEVEL on $host"
          echo ""
          if [ -n "$lines" ]; then
            echo "**What a hostile AI agent could steal, abuse or trick:**"
            echo ""
            while read -r l; do [ -n "$l" ] && echo "- $l"; done <<<"$lines"
          else
            echo "No AI-era way in found from the outside."
          fi
          echo ""
          echo "Defense score $score/100 ($grade). Full report and fixes: https://simgen.dev/agentdecoy/?site=$host"
          echo ""
          echo "Which file, key, tool or route: install AgentDecoy free on the site and open the deep scan in your dashboard."
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -n "$MIN" ]; then
          rank() { case "$1" in A) echo 1;; B) echo 2;; C) echo 3;; D) echo 4;; *) echo 5;; esac; }
          if [ "$(rank "$grade")" -gt "$(rank "${MIN^^}")" ]; then
            echo "::error::$host defense grade $grade ($score/100) is below the minimum ${MIN^^}. https://simgen.dev/agentdecoy/?site=$host"
            exit 1
          fi
        else
          lv() { case "$1" in critical) echo 4;; elevated) echo 3;; guarded) echo 2;; *) echo 1;; esac; }
          if [ "$(lv "$level")" -ge "$(lv "${FAIL_ON,,}")" ]; then
            echo "::error::Threat level $LEVEL on $host: $n way(s) in for a hostile AI agent. https://simgen.dev/agentdecoy/?site=$host"
            exit 1
          fi
        fi
        echo "Threat level $LEVEL on $host ($n way(s) in, defense score $score/100)."
