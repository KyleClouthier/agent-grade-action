name: 'Agent Grade check'
description: 'Fail the build when your site drops below a grade for AI search visibility and AI attack-agent exposure.'
author: 'Kyle Clouthier'
branding:
  icon: 'shield'
  color: 'yellow'
inputs:
  site:
    description: 'The site to grade, for example example.com'
    required: true
  min-grade:
    description: 'Lowest grade that passes: A, B, C, D or F'
    required: false
    default: 'C'
  api-key:
    description: 'Optional Agent Grade Pro or Agency API key (120 checks an hour instead of 10)'
    required: false
    default: ''
outputs:
  grade:
    description: 'The letter grade'
    value: ${{ steps.grade.outputs.grade }}
  score:
    description: 'The score out of 100'
    value: ${{ steps.grade.outputs.score }}
runs:
  using: 'composite'
  steps:
    - id: grade
      shell: bash
      env:
        SITE: ${{ inputs.site }}
        MIN: ${{ inputs.min-grade }}
        KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        url="https://simgen.dev/api/agent-grade?site=$(jq -rn --arg s "$SITE" '$s|@uri')"
        if [ -n "$KEY" ]; then
          resp=$(curl -sS --max-time 90 -H "x-agent-grade-key: $KEY" "$url")
        else
          resp=$(curl -sS --max-time 90 "$url")
        fi
        err=$(jq -r '.error // empty' <<<"$resp")
        if [ -n "$err" ]; then echo "::error::Agent Grade could not check $SITE: $err"; exit 1; fi
        grade=$(jq -r '.grade' <<<"$resp"); score=$(jq -r '.score' <<<"$resp"); host=$(jq -r '.site' <<<"$resp")
        found=$(jq -r '.parts.found.points' <<<"$resp"); prot=$(jq -r '.parts.protected.points' <<<"$resp"); safe=$(jq -r '.parts.agentSafe.points' <<<"$resp")
        echo "grade=$grade" >> "$GITHUB_OUTPUT"; echo "score=$score" >> "$GITHUB_OUTPUT"

        # Warnings for each thing that costs points, so they show on the run page.
        jq -r '.parts.found.blockedByRobots[]? | "Blocked in robots.txt: \(.)"' <<<"$resp" | while read -r l; do echo "::warning::$l"; done
        jq -r '.parts.protected.headers[]? | select(.ok == false) | "Missing header: \(.name)"' <<<"$resp" | while read -r l; do echo "::warning::$l"; done
        jq -r '.caps[]?' <<<"$resp" | while read -r l; do echo "::error::$l"; done

        {
          echo "## Agent Grade: $host is $grade ($score/100)"
          echo ""
          echo "| Part | Points |"
          echo "| --- | --- |"
          echo "| Found by search and AI | $found / 40 |"
          echo "| Protected from attack agents | $prot / 45 |"
          echo "| Safe for visiting AI agents | $safe / 15 |"
          echo ""
          echo "Full result: https://simgen.dev/agent-grade/?site=$host"
        } >> "$GITHUB_STEP_SUMMARY"

        rank() { case "$1" in A) echo 1;; B) echo 2;; C) echo 3;; D) echo 4;; *) echo 5;; esac; }
        if [ "$(rank "$grade")" -gt "$(rank "${MIN^^}")" ]; then
          echo "::error::$host graded $grade ($score/100), below the minimum ${MIN^^}. Details: https://simgen.dev/agent-grade/?site=$host"
          exit 1
        fi
        echo "$host graded $grade ($score/100), at or above ${MIN^^}."
